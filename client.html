<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PVZ — Клиент</title>

    <link
        rel="stylesheet"
        href="css/main.css">

    <link
        rel="stylesheet"
        href="css/client.css">

</head>


<body>


<header class="topbar">

    <div class="logo">
        PVZ
    </div>


    <div>

        <span
            id="userEmail">

        </span>


        <button
            id="logoutButton"
            class="button">

            Выйти

        </button>

    </div>

</header>


<main class="container">


    <h1>
        Личный кабинет
    </h1>


    <div class="card">

        <h2>
            Новый заказ
        </h2>


        <form
            id="createOrderForm">


            <input
                id="productName"
                type="text"
                placeholder="Название товара"
                required>


            <textarea
                id="productDescription"
                placeholder="Описание товара"></textarea>


            <button
                type="submit"
                class="button primary">

                Создать заказ

            </button>


        </form>

    </div>


    <div class="card">

        <h2>
            Мои заказы
        </h2>


        <div
            id="ordersList">

            Загрузка...

        </div>

    </div>


</main>


<script
    type="module"
    src="js/client.js">
</script>


</body>

</html>
