<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PVZ Scanner 2D — Настройки</title>

    <link rel="stylesheet"
          href="css/main.css">

    <script
        src="js/common.js"
        defer>
    </script>

    <script
        src="js/settings.js"
        defer>
    </script>

</head>

<body>

<header>

    <div class="logo">
        PVZ <span>Scanner 2D</span>
    </div>

    <nav>

        <a href="index.html">
            Главная
        </a>

        <a href="scanner.html">
            Сканер
        </a>

        <a href="history.html">
            История
        </a>

        <a class="active"
           href="settings.html">
            Настройки
        </a>

    </nav>

</header>


<main class="container">

    <div class="eyebrow">
        НАСТРОЙКИ
    </div>

    <h1>
        Настройки
    </h1>


    <section class="panel settings">

        <label>

            <span>
                Звук после сканирования
            </span>

            <input
                id="sound"
                type="checkbox">

        </label>


        <label>

            <span>
                Автоматически сохранять
            </span>

            <input
                id="autosave"
                type="checkbox">

        </label>


        <label>

            <span>
                Тёмная тема
            </span>

            <input
                id="dark"
                type="checkbox">

        </label>


        <div class="info">

            <b>
                Информация
            </b>

            <p>
                История и настройки сохраняются
                только в браузере на этом устройстве.
            </p>

        </div>

    </section>

</main>


<footer>
    PVZ Scanner 2D
</footer>

</body>
</html>
