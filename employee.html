<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarketPoint — ПВЗ</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="employee.html">Market<span>Point</span></a>
  <div class="top-actions"><span id="employeeName"></span><button id="logout" class="navbtn danger-text">Выйти</button></div>
</header>
<main class="container">
  <section class="hero small-hero">
    <div><p class="eyebrow">ПУНКТ ВЫДАЧИ ЗАКАЗОВ</p><h1 id="pvzTitle">ПВЗ</h1><p id="pvzAddress" class="muted"></p></div>
  </section>

  <div class="dashboard-grid">
    <section class="panel">
      <h2>Сканирование QR</h2>
      <div id="reader"></div>
      <button id="manualScan" class="btn secondary full">Ввести код вручную</button>
      <div id="scanResult"></div>
    </section>
    <section class="panel">
      <h2>Последние заказы</h2>
      <div id="employeeOrders"></div>
    </section>
  </div>
</main>
<script type="module" src="js/employee.js"></script>
</body>
</html>
