<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PVZ — Сканер</title>

    <link rel="stylesheet"
          href="css/main.css">

    <script
        src="https://unpkg.com/html5-qrcode"
        defer>
    </script>

    <script
        type="module"
        src="js/scanner.js">
    </script>

</head>

<body>

<header>

    <div class="logo">
        PVZ
    </div>

    <nav>

        <a href="index.html">
            Вход
        </a>

        <a class="active"
           href="scanner.html">
            Сканер
        </a>

    </nav>

</header>


<main class="container">

    <div class="page-title">

        <div>

            <div class="eyebrow">
                ПВЗ
            </div>

            <h1>
                Сканер QR
            </h1>

        </div>

    </div>


    <section class="scanner-panel">

        <div id="reader"></div>

        <div
            id="scannerMessage"
            class="message">

            Нажмите кнопку запуска.

        </div>


        <button
            id="startScanner"
            class="button primary">

            Запустить камеру

        </button>


        <button
            id="stopScanner"
            class="button secondary"
            disabled>

            Остановить

        </button>

    </section>


    <section class="panel">

        <h2>
            Результат
        </h2>

        <div id="scanResult">
            —
        </div>

    </section>

</main>

</body>
</html>
