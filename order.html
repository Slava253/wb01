<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PVZ — Заказ</title>

    <link rel="stylesheet"
          href="css/main.css">

    <script
        type="module"
        src="js/order.js">
    </script>

</head>

<body>

<header>

    <div class="logo">
        PVZ
    </div>

    <nav>

        <a href="client.html">
            Мои заказы
        </a>

        <button id="logoutButton">
            Выйти
        </button>

    </nav>

</header>


<main class="container">

    <div class="page-title">

        <div>

            <div class="eyebrow">
                ЗАКАЗ
            </div>

            <h1 id="orderNumber">
                Загрузка...
            </h1>

        </div>

    </div>


    <section class="order-layout">

        <div class="panel">

            <h2 id="productName">
                —
            </h2>

            <p id="description"
               class="muted">
            </p>

            <div class="order-status">

                <span>
                    Статус
                </span>

                <strong id="status">
                    —
                </strong>

            </div>

        </div>


        <div class="panel qr-panel">

            <h2>
                QR-код
            </h2>

            <div id="qrcode"></div>

            <p class="muted">
                Покажите этот QR-код
                сотруднику ПВЗ.
            </p>

        </div>

    </section>

</main>

</body>
</html>
