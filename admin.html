<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PVZ — Панель</title>

    <link
        rel="stylesheet"
        href="css/main.css">

    <link
        rel="stylesheet"
        href="css/admin.css">


    <style>

        .admin-section {

            margin-bottom: 25px;

        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(160px, 1fr)
                );

            gap: 15px;

            margin-bottom: 25px;

        }


        .stat-card {

            padding: 20px;

            border-radius: 12px;

            background: white;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.08);

        }


        .stat-number {

            font-size: 32px;

            font-weight: 800;

            margin-top: 8px;

        }


        .form-card {

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.08);

        }


        .form-card input,
        .form-card select {

            width: 100%;

            margin-bottom: 12px;

            box-sizing: border-box;

        }


        .success {

            margin-top: 10px;

            min-height: 20px;

        }


        .hidden {

            display: none !important;

        }


        .employee-card,
        .pvz-card {

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            margin-top: 10px;

        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        PVZ
    </div>


    <div>

        <span
            id="userEmail">

        </span>


        <button
            id="logoutButton"
            class="button">

            Выйти

        </button>

    </div>

</header>


<main class="container">


    <!-- =================================
         АДМИН
    ================================== -->

    <section
        id="adminPanel"
        class="admin-section hidden">


        <h1>
            Панель администратора
        </h1>


        <p class="muted">

            Администратор может управлять
            ПВЗ и сотрудниками.

        </p>


        <!-- СТАТИСТИКА -->

        <div class="stats">

            <div class="stat-card">

                <div>
                    Всего заказов
                </div>

                <div
                    id="allCount"
                    class="stat-number">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div>
                    Прибыли в ПВЗ
                </div>

                <div
                    id="arrivedCount"
                    class="stat-number">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div>
                    Готовы к выдаче
                </div>

                <div
                    id="readyCount"
                    class="stat-number">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div>
                    Выданы
                </div>

                <div
                    id="issuedCount"
                    class="stat-number">

                    0

                </div>

            </div>

        </div>


        <!-- СОЗДАНИЕ ПВЗ -->

        <div class="form-card">

            <h2>
                Добавить ПВЗ
            </h2>


            <input
                id="pvzName"
                type="text"
                placeholder="Название ПВЗ">


            <input
                id="pvzAddress"
                type="text"
                placeholder="Адрес ПВЗ">


            <button
                id="createPvzButton"
                class="button primary">

                Добавить ПВЗ

            </button>


            <div
                id="pvzMessage"
                class="success">

            </div>

        </div>


        <!-- СОЗДАНИЕ СОТРУДНИКА -->

        <div class="form-card">

            <h2>
                Добавить сотрудника ПВЗ
            </h2>


            <input
                id="employeeName"
                type="text"
                placeholder="Имя сотрудника">


            <input
                id="employeeLogin"
                type="text"
                placeholder="Логин">


            <input
                id="employeePassword"
                type="password"
                placeholder="Пароль">


            <select
                id="employeePvz">

                <option value="">
                    Выберите ПВЗ
                </option>

            </select>


            <button
                id="createEmployeeButton"
                class="button primary">

                Создать сотрудника

            </button>


            <div
                id="employeeMessage"
                class="success">

            </div>

        </div>


        <!-- СПИСОК ПВЗ -->

        <div class="form-card">

            <h2>
                ПВЗ
            </h2>


            <div
                id="pvzList">

                Загрузка...

            </div>

        </div>


        <!-- СПИСОТ СОТРУДНИКОВ -->

        <div class="form-card">

            <h2>
                Сотрудники
            </h2>


            <div
                id="employeesList">

                Загрузка...

            </div>

        </div>


    </section>


    <!-- =================================
         ПВЗ
    ================================== -->

    <section
        id="pvzPanel"
        class="admin-section hidden">


        <h1>
            Панель ПВЗ
        </h1>


        <p>

            ПВЗ:

            <strong
                id="currentPvzName">

            </strong>

        </p>


        <input
            id="search"
            type="search"
            placeholder="Поиск заказа">


        <div class="stats">

            <div class="stat-card">

                <div>
                    Всего
                </div>

                <div
                    id="allCount"
                    class="stat-number">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div>
                    Прибыли
                </div>

                <div
                    id="arrivedCount"
                    class="stat-number">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div>
                    Готовы
                </div>

                <div
                    id="readyCount"
                    class="stat-number">

                    0

                </div>

            </div>


            <div class="stat-card">

                <div>
                    Выданы
                </div>

                <div
                    id="issuedCount"
                    class="stat-number">

                    0

                </div>

            </div>

        </div>


        <div
            id="ordersList">

            Загрузка...

        </div>


    </section>


</main>


<script
    type="module"
    src="js/admin.js">
</script>


</body>

</html>
