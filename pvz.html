<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PVZ — Пункт выдачи</title>

    <link
        rel="stylesheet"
        href="css/main.css">

    <style>

        .pvz-header {

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;

        }


        .pvz-actions {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 20px;

        }


        .pvz-action {

            min-height: 180px;

            border: 0;

            border-radius: 20px;

            background: white;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.10);

            font-size: 28px;

            font-weight: 800;

            cursor: pointer;

        }


        .pvz-action:hover {

            transform: translateY(-2px);

        }


        .pvz-work {

            margin-top: 25px;

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.08);

        }


        .hidden {

            display: none !important;

        }


        #reader {

            width: 100%;

            max-width: 500px;

            margin: 20px auto;

        }


        .scan-result {

            text-align: center;

            font-size: 20px;

            font-weight: 700;

            margin: 20px 0;

        }


        .cell-number {

            font-size: 56px;

            font-weight: 900;

            text-align: center;

            margin: 20px 0;

        }


        .work-title {

            text-align: center;

            font-size: 28px;

        }

    </style>

</head>


<body>


<main class="container">


    <div class="pvz-header">

        <div>

            <div class="logo">
                PVZ
            </div>

            <div>
                <strong id="pvzName">
                    ПВЗ
                </strong>
            </div>

        </div>


        <button
            id="logoutButton"
            class="button">

            Выйти

        </button>

    </div>


    <!-- КНОПКИ -->

    <div
        id="mainButtons"
        class="pvz-actions">


        <button
            id="acceptButton"
            class="pvz-action">

            📦<br>
            Приёмка

        </button>


        <button
            id="issueButton"
            class="pvz-action">

            🛍️<br>
            Выдача

        </button>

    </div>


    <!-- РАБОТА -->

    <div
        id="workPanel"
        class="pvz-work hidden">


        <h2
            id="workTitle"
            class="work-title">

        </h2>


        <div
            id="reader">

        </div>


        <div
            id="scanResult"
            class="scan-result">

        </div>


        <div
            id="cellNumber"
            class="cell-number">

        </div>


        <button
            id="backButton"
            class="button"
            style="width:100%;">

            Назад

        </button>

    </div>


</main>


<script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
</script>


<script
    type="module"
    src="js/pvz.js">
</script>


</body>

</html>
