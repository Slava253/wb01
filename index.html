<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PVZ Scanner 2D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PVZ Scanner 2D</h1>
        <p>Сканер кодов пункта выдачи</p>
    </header>

    <main>

        <section class="scanner">
            <h2>Сканирование</h2>

            <div id="scanner-box">
                <div class="scan-line"></div>
                <span>Область сканирования</span>
            </div>

            <button id="scanButton">
                Сканировать
            </button>
        </section>

        <section class="result">
            <h2>Результат</h2>

            <div id="resultBox">
                Код ещё не отсканирован
            </div>

            <button id="clearButton">
                Очистить
            </button>
        </section>

    </main>

    <footer>
        PVZ Scanner 2D
    </footer>

    <script src="script.js"></script>

</body>
</html>
