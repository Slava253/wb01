<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PVZ — Вход</title>

    <link rel="stylesheet" href="css/main.css">

    <script type="module" src="js/auth.js"></script>
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo-big">
            PVZ
        </div>

        <h1>
            Пункт выдачи
        </h1>

        <p class="muted">
            Войдите в систему
        </p>

        <input
            id="email"
            type="email"
            placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Пароль">

        <button
            id="loginButton"
            class="button primary">
            Войти
        </button>

        <button
            id="registerButton"
            class="button secondary">
            Создать аккаунт
        </button>

        <a
            href="admin.html"
            class="admin-link">
            Вход администратора
        </a>

        <div
            id="authMessage"
            class="message">
        </div>

    </div>

</div>

</body>
</html>
