<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PVZ — Вход</title>

    <link
        rel="stylesheet"
        href="css/main.css">

    <style>

        .login-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #eef1f5;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .login-tab {
            border: 0;
            background: transparent;
            padding: 12px 5px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        .login-tab.active {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .login-section {
            display: none;
        }

        .login-section.active {
            display: block;
        }

        .message {
            margin-top: 15px;
            min-height: 22px;
            text-align: center;
        }

    </style>
</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo-big">
            PVZ
        </div>

        <h1>
            Вход
        </h1>

        <p
            class="muted"
            style="text-align:center;">

            Система пунктов выдачи

        </p>


        <div class="login-tabs">

            <button
                class="login-tab active"
                data-tab="client">

                Клиент

            </button>

            <button
                class="login-tab"
                data-tab="admin">

                Админ

            </button>

            <button
                class="login-tab"
                data-tab="pvz">

                ПВЗ

            </button>

        </div>


        <!-- КЛИЕНТ -->

        <div
            id="clientSection"
            class="login-section active">

            <h2>
                Вход клиента
            </h2>

            <p class="muted">
                Введите номер телефона.
                Код подтверждения не нужен.
            </p>

            <input
                id="phoneNumber"
                type="tel"
                placeholder="+491234567890">

            <button
                id="clientLoginButton"
                class="button primary"
                style="width:100%;">

                Войти

            </button>

        </div>


        <!-- АДМИН -->

        <div
            id="adminSection"
            class="login-section">

            <h2>
                Администратор
            </h2>

            <input
                id="adminLogin"
                type="text"
                placeholder="Логин">

            <input
                id="adminPassword"
                type="password"
                placeholder="Пароль">

            <button
                id="adminLoginButton"
                class="button primary"
                style="width:100%;">

                Войти

            </button>

        </div>


        <!-- ПВЗ -->

        <div
            id="pvzSection"
            class="login-section">

            <h2>
                Сотрудник ПВЗ
            </h2>

            <input
                id="pvzLogin"
                type="text"
                placeholder="Логин">

            <input
                id="pvzPassword"
                type="password"
                placeholder="Пароль">

            <button
                id="pvzLoginButton"
                class="button primary"
                style="width:100%;">

                Войти

            </button>

        </div>


        <div
            id="authMessage"
            class="message">

        </div>

    </div>

</div>


<script
    type="module"
    src="js/auth.js">
</script>

</body>
</html>
