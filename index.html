<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>🚻 Туалет | Очередь</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            color: white;
            padding: 20px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .header p {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 4px;
        }

        .main-content {
            padding: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #eef2f8;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 650;
            color: #1a1a2e;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            font-weight: 600;
            color: #1e2f41;
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #dae2ec;
            border-radius: 16px;
            font-size: 1rem;
            transition: 0.2s;
            background: #fbfdff;
        }

        input:focus {
            outline: none;
            border-color: #1a1a2e;
            box-shadow: 0 0 0 4px rgba(26,26,46,0.08);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #0e0e1e;
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a3f8e 100%);
        }

        .btn-success {
            background: #1d6f2c;
        }

        .btn-success:hover {
            background: #155a22;
        }

        .btn-danger {
            background: #b33a34;
        }

        .btn-danger:hover {
            background: #8f2d28;
        }

        .btn-warning {
            background: #d4a13e;
            color: #1a1a2e;
        }

        .btn-warning:hover {
            background: #b8892e;
        }

        .btn-urgent {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 1.1rem;
            padding: 16px;
        }

        .btn-urgent:hover {
            transform: scale(0.98);
        }

        .btn-urgent:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #dae2ec;
            color: #1a1a2e;
        }

        .btn-outline:hover {
            background: #eef2f8;
            transform: scale(0.98);
        }

        .success-toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1d6f2c;
            color: white;
            padding: 14px 20px;
            border-radius: 40px;
            z-index: 9999;
            animation: slideFade 3s ease forwards;
            text-align: center;
            font-weight: 500;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .error-toast {
            background: #b33a34;
        }

        @keyframes slideFade {
            0% { opacity: 0; transform: translateY(30px); }
            12% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(30px); visibility: hidden; }
        }

        .user-info {
            background: #f8faff;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border: 1px solid #eef2f8;
        }

        .user-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1a1a2e;
        }

        .urgent-count {
            font-size: 0.8rem;
            color: #7a8a9e;
        }

        .schedule-item {
            background: #f8faff;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .schedule-item .time {
            font-weight: 600;
            color: #1a1a2e;
        }

        .schedule-item .name {
            color: #3e5f7e;
        }

        .schedule-item .delete-btn {
            background: none;
            border: none;
            color: #b33a34;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #7a8a9e;
            font-size: 0.9rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 28px;
            padding: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 650;
            color: #1a1a2e;
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-cancel {
            background: #eef2f8;
            color: #1a1a2e;
        }

        .btn-cancel:hover {
            background: #dae2ec;
        }

        .time-inputs {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .time-inputs input {
            flex: 1;
        }

        .time-inputs span {
            color: #7a8a9e;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #7a8a9e;
        }

        @media (max-width: 480px) {
            .app-container { border-radius: 24px; }
            .header h1 { font-size: 1.4rem; }
            .main-content { padding: 16px; }
            .card { padding: 16px; }
            .time-inputs { flex-direction: column; }
            .time-inputs span { display: none; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <div class="header">
            <h1>🚻 Туалет</h1>
            <p>Система управления очередью</p>
        </div>

        <div class="main-content">
            <!-- Вход -->
            <div id="loginSection" class="card">
                <div class="card-title">👤 Вход</div>
                <div class="form-group">
                    <label>Введите ваше имя</label>
                    <input type="text" id="userNameInput" placeholder="Например: Иван" maxlength="30">
                </div>
                <button onclick="login()" class="btn btn-primary">🚪 Войти</button>
            </div>

            <!-- Основной интерфейс -->
            <div id="mainSection" style="display:none;">
                <div class="user-info">
                    <div>
                        <div class="user-name" id="displayName">👤 Имя</div>
                        <div class="urgent-count" id="urgentCount">⚡ Срочно: 5/5 раз сегодня</div>
                    </div>
                    <button onclick="logout()" class="btn" style="width:auto; padding:6px 16px; font-size:0.8rem; background:#eef2f8; color:#1a1a2e;">Выйти</button>
                </div>

                <div class="card">
                    <div class="card-title">📅 Расписание на сегодня</div>
                    <div id="scheduleList"><div class="loading">Загрузка...</div></div>
                </div>

                <button onclick="openBookingModal()" class="btn btn-success" style="margin-bottom:12px;">🚻 Занять очередь</button>
                <button onclick="useUrgent()" class="btn btn-urgent" id="urgentBtn">⚡ Срочно! (5 раз в день)</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно бронирования -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🚻 Занять очередь</div>
            <div class="form-group">
                <label>Ваше имя</label>
                <input type="text" id="bookingName" readonly style="background:#f0f4f9;">
            </div>
            <div class="form-group">
                <label>📅 Дата</label>
                <input type="date" id="bookingDate">
            </div>
            <div class="form-group">
                <label>⏰ Время</label>
                <div class="time-inputs">
                    <input type="time" id="bookingStart" step="600">
                    <span>—</span>
                    <input type="time" id="bookingEnd" step="600">
                </div>
            </div>
            <div class="modal-buttons">
                <button onclick="confirmBooking()" class="btn-success" style="flex:2;">✅ Забронировать</button>
                <button onclick="closeBookingModal()" class="btn-cancel" style="flex:1;">Отмена</button>
            </div>
        </div>
    </div>

    <div id="toast" class="success-toast" style="display:none;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        // ===== FIREBASE КОНФИГ =====
        const firebaseConfig = {
            apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
            authDomain: "bk-cashier.firebaseapp.com",
            databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bk-cashier",
            storageBucket: "bk-cashier.firebasestorage.app",
            messagingSenderId: "385000840969",
            appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ===== ПЕРЕМЕННЫЕ =====
        let currentUser = null;
        let scheduleRef = null;
        let urgentRef = null;

        // ===== ВХОД/ВЫХОД =====
        function login() {
            const name = document.getElementById('userNameInput').value.trim();
            if (!name) {
                showToast('❌ Введите ваше имя!', true);
                return;
            }
            
            currentUser = name;
            localStorage.setItem('toilet_user', name);
            
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            updateUI();
            showToast(`👋 Добро пожаловать, ${name}!`);
            
            // Подписываемся на обновления
            listenToSchedule();
            listenToUrgent();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('toilet_user');
            if (scheduleRef) scheduleRef.off();
            if (urgentRef) urgentRef.off();
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('mainSection').style.display = 'none';
            document.getElementById('userNameInput').value = '';
            showToast('👋 Вы вышли');
        }

        // ===== СЛУШАТЕЛИ FIREBASE =====
        function listenToSchedule() {
            const today = new Date().toISOString().split('T')[0];
            scheduleRef = db.ref('schedule/' + today);
            scheduleRef.on('value', snap => {
                const data = snap.val();
                renderSchedule(data);
            });
        }

        function listenToUrgent() {
            const today = new Date().toISOString().split('T')[0];
            urgentRef = db.ref('urgent/' + today);
            urgentRef.on('value', snap => {
                const data = snap.val();
                updateUrgentCount(data);
            });
        }

        // ===== ОБНОВЛЕНИЕ ИНТЕРФЕЙСА =====
        function updateUI() {
            if (!currentUser) return;
            document.getElementById('displayName').textContent = `👤 ${currentUser}`;
        }

        function updateUrgentCount(data) {
            const used = data ? Object.keys(data).length : 0;
            const remaining = Math.max(0, 5 - used);
            document.getElementById('urgentCount').textContent = `⚡ Срочно: ${remaining}/5 раз сегодня`;
            document.getElementById('urgentBtn').disabled = remaining <= 0;
        }

        function renderSchedule(data) {
            const container = document.getElementById('scheduleList');
            
            if (!data) {
                container.innerHTML = '<div class="empty-state">📭 Сегодня никто не записан</div>';
                return;
            }
            
            // Преобразуем в массив и сортируем
            const items = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            }));
            
            items.sort((a, b) => a.start.localeCompare(b.start));
            
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 Сегодня никто не записан</div>';
                return;
            }
            
            let html = '';
            items.forEach(item => {
                const isCurrentUser = item.user === currentUser;
                html += `
                    <div class="schedule-item" style="border-left-color: ${isCurrentUser ? '#1d6f2c' : '#667eea'};">
                        <div>
                            <div class="time">${item.start} — ${item.end}</div>
                            <div class="name">${item.user} ${isCurrentUser ? '👈' : ''}</div>
                            ${item.isUrgent ? '<span style="color:#f5576c; font-weight:bold; font-size:0.7rem;">⚡ СРОЧНО</span>' : ''}
                        </div>
                        ${isCurrentUser ? `<button class="delete-btn" onclick="cancelBooking('${item.id}')">✕</button>` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ===== БРОНИРОВАНИЕ =====
        function openBookingModal() {
            if (!currentUser) return;
            
            document.getElementById('bookingName').value = currentUser;
            
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            document.getElementById('bookingDate').value = dateStr;
            
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = Math.ceil(now.getMinutes() / 30) * 30;
            const startTime = `${String(currentHour).padStart(2, '0')}:${String(currentMinute).padStart(2, '0')}`;
            document.getElementById('bookingStart').value = startTime;
            
            let endHour = currentHour;
            let endMinute = currentMinute + 30;
            if (endMinute >= 60) {
                endMinute -= 60;
                endHour += 1;
            }
            const endTime = `${String(endHour).padStart(2, '0')}:${String(endMinute).padStart(2, '0')}`;
            document.getElementById('bookingEnd').value = endTime;
            
            document.getElementById('bookingModal').classList.add('active');
        }

        function closeBookingModal() {
            document.getElementById('bookingModal').classList.remove('active');
        }

        async function confirmBooking() {
            const user = document.getElementById('bookingName').value.trim();
            const date = document.getElementById('bookingDate').value;
            const start = document.getElementById('bookingStart').value;
            const end = document.getElementById('bookingEnd').value;
            
            if (!user || !date || !start || !end) {
                showToast('❌ Заполните все поля!', true);
                return;
            }
            
            if (start >= end) {
                showToast('❌ Время окончания должно быть позже начала!', true);
                return;
            }
            
            try {
                // Проверяем пересечение
                const snap = await db.ref('schedule/' + date).once('value');
                const data = snap.val();
                
                let conflict = false;
                if (data) {
                    for (let key in data) {
                        const item = data[key];
                        if ((start >= item.start && start < item.end) || 
                            (end > item.start && end <= item.end) ||
                            (start <= item.start && end >= item.end)) {
                            conflict = true;
                            break;
                        }
                    }
                }
                
                if (conflict) {
                    showToast('❌ Это время уже занято! Выберите другое.', true);
                    return;
                }
                
                // Сохраняем бронирование
                const newBooking = {
                    user: user,
                    start: start,
                    end: end,
                    isUrgent: false,
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                };
                
                await db.ref('schedule/' + date).push(newBooking);
                
                closeBookingModal();
                showToast(`✅ ${user}, вы записаны на ${start} — ${end}!`);
            } catch (error) {
                console.error('Ошибка бронирования:', error);
                showToast('❌ Ошибка бронирования', true);
            }
        }

        async function cancelBooking(id) {
            if (!confirm('Отменить запись?')) return;
            
            try {
                const today = new Date().toISOString().split('T')[0];
                await db.ref('schedule/' + today + '/' + id).remove();
                showToast('🗑 Запись отменена');
            } catch (error) {
                console.error('Ошибка отмены:', error);
                showToast('❌ Ошибка отмены', true);
            }
        }

        // ===== СРОЧНО =====
        async function useUrgent() {
            if (!currentUser) return;
            
            try {
                const today = new Date().toISOString().split('T')[0];
                
                // Проверяем лимит
                const urgentSnap = await db.ref('urgent/' + today).once('value');
                const urgentData = urgentSnap.val();
                const used = urgentData ? Object.keys(urgentData).length : 0;
                
                if (used >= 5) {
                    showToast('❌ Лимит срочных вызовов исчерпан на сегодня! (5/5)', true);
                    return;
                }
                
                // Находим свободное время
                const scheduleSnap = await db.ref('schedule/' + today).once('value');
                const scheduleData = scheduleSnap.val();
                
                const now = new Date();
                let startHour = now.getHours();
                let startMinute = Math.ceil(now.getMinutes() / 15) * 15;
                
                let found = false;
                let startTime, endTime;
                let attempts = 0;
                
                while (attempts < 100 && !found) {
                    let endMinute2 = startMinute + 30;
                    let endHour2 = startHour;
                    if (endMinute2 >= 60) {
                        endMinute2 -= 60;
                        endHour2 += 1;
                    }
                    
                    const startStr = `${String(startHour).padStart(2, '0')}:${String(startMinute).padStart(2, '0')}`;
                    const endStr = `${String(endHour2).padStart(2, '0')}:${String(endMinute2).padStart(2, '0')}`;
                    
                    let conflict = false;
                    if (scheduleData) {
                        for (let key in scheduleData) {
                            const item = scheduleData[key];
                            if ((startStr >= item.start && startStr < item.end) || 
                                (endStr > item.start && endStr <= item.end) ||
                                (startStr <= item.start && endStr >= item.end)) {
                                conflict = true;
                                break;
                            }
                        }
                    }
                    
                    if (!conflict) {
                        startTime = startStr;
                        endTime = endStr;
                        found = true;
                        break;
                    }
                    
                    startMinute += 15;
                    if (startMinute >= 60) {
                        startMinute -= 60;
                        startHour += 1;
                    }
                    attempts++;
                }
                
                if (!found) {
                    showToast('❌ Не найдено свободного времени. Попробуйте позже.', true);
                    return;
                }
                
                // Создаем срочную запись
                const urgentBooking = {
                    user: currentUser,
                    start: startTime,
                    end: endTime,
                    isUrgent: true,
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                };
                
                // Сохраняем в расписание
                await db.ref('schedule/' + today).push(urgentBooking);
                
                // Сохраняем в срочные вызовы
                await db.ref('urgent/' + today).push({
                    user: currentUser,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                
                showToast(`⚡ СРОЧНО! Вы записаны на ${startTime} — ${endTime}`);
            } catch (error) {
                console.error('Ошибка срочного вызова:', error);
                showToast('❌ Ошибка', true);
            }
        }

        // ===== TOAST =====
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = isError ? 'error-toast success-toast' : 'success-toast';
            toast.style.display = 'block';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // ===== ЗАКРЫТИЕ МОДАЛКИ =====
        document.getElementById('bookingModal').addEventListener('click', function(e) {
            if (e.target === this) closeBookingModal();
        });

        // ===== ЗАПУСК =====
        const savedUser = localStorage.getItem('toilet_user');
        if (savedUser) {
            currentUser = savedUser;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            updateUI();
            listenToSchedule();
            listenToUrgent();
        }
    </script>
</body>
</html>
